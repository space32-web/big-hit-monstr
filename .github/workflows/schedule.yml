name: Расписание

on:
  schedule:
    - cron: '20 */2 * * *' # каждые 2 часа
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-schedule.mjs
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
      - name: Сохранить изменения
        run: |
          git config user.name "knn-bot"
          git config user.email "knn-bot@users.noreply.github.com"
          git add docs/data state
          git diff --cached --quiet && exit 0
          git commit -m "Расписание обновлено"
          git pull --rebase
          git push
